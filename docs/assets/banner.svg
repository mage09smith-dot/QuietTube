<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">QuietTube</title>
  <desc id="desc">Modern flat label — warm paper, charcoal type, vermilion block. Hard edges, no gradients. A YouTube tweak for iOS.</desc>
  <rect width="1280" height="400" fill="#F1EBDD"/>
  <!-- top and bottom hard rules — slightly off-weight for imperfect -->
  <rect x="0" y="0" width="1280" height="9" fill="#20201E"/>
  <rect x="0" y="391" width="1280" height="9" fill="#C64936"/>
  <!-- left solid block — asymmetric, not centered -->
  <rect x="0" y="9" width="18" height="382" fill="#C64936"/>
  <!-- Q mark block — geometric, hard edge, slightly offset -->
  <rect x="64" y="72" width="94" height="94" fill="#20201E"/>
  <rect x="92" y="98" width="38" height="38" fill="#F1EBDD"/>
  <rect x="130" y="136" width="16" height="16" fill="#C64936"/>
  <!-- wordmark — geometric sans, tight tracking, left-aligned but not perfectly -->
  <g fill="#20201E" font-family="Arial, Helvetica, Liberation Sans, sans-serif">
    <text x="188" y="154" font-size="118" font-weight="800" letter-spacing="-5.5">QuietTube</text>
    <text x="192" y="192" font-size="22" letter-spacing="0.2">A YouTube tweak for iOS.</text>
    <text x="192" y="222" font-size="13" letter-spacing="1.2" fill="#C64936">21.38.2 — FORK-BUILD — LIVE CONTAINER TESTED</text>
  </g>
  <!-- small off-grid dot for imperfection -->
  <rect x="1124" y="298" width="7" height="7" fill="#C64936"/>
  <rect x="1136" y="298" width="7" height="7" fill="#20201E"/>
  <rect x="1148" y="298" width="7" height="7" fill="#C64936"/>
</svg>
